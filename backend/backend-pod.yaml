apiVersion: v1
kind: Pod
metadata:
  name: backend
  labels:
    app: backend
spec:
  containers:
    - name: backend
      image: surajtatskar/student-registration-jenkins:backend
      imagePullPolicy: Always
      ports:
        - containerPort: 8080
      env:
        - name: DB_HOST
          value: "database-1.cwhuss4mk01v.us-east-1.rds.amazonaws.com"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "student_db"
        - name: DB_USER
          value: "admin"
        - name: DB_PASS
          value: "redhat123"
